[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virtual-fs-agent"
version = "0.1.0"
description = "Python AMP agent with memory notes, memory session filesystem, and MCP wiring."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "github-copilot-sdk>=0.5.0,<0.6.0",
  "pydantic>=2",
]

[project.scripts]
virtual_fs_agent = "virtual_fs_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true
